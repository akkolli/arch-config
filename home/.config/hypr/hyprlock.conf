general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.62
    vibrancy = 0.16
    vibrancy_darkness = 0.1
}

label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(fff0dcf2)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(c8aeb0e6)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 42
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] whoami
    color = rgba(ffb15cf2)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Propo
    position = 0, 12
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true
    outer_color = rgba(ffb15cb8)
    inner_color = rgba(1b1420c7)
    font_color = rgba(fff0dcff)
    fail_color = rgba(d985a3ff)
    check_color = rgba(ffe0a8ff)
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL</i>
    fade_on_empty = false
    rounding = 12
    position = 0, -70
    halign = center
    valign = center
}
