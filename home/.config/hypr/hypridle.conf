# sample hypridle.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hypridle

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = sh -c 'command -v brightnessctl >/dev/null && brightnessctl -s set 10'
    on-resume = sh -c 'command -v brightnessctl >/dev/null && brightnessctl -r'
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = sh -c 'command -v brightnessctl >/dev/null && brightnessctl -sd rgb:kbd_backlight set 0'
    on-resume = sh -c 'command -v brightnessctl >/dev/null && brightnessctl -rd rgb:kbd_backlight'
}

listener {
    timeout = 300                                 # 5min.
    on-timeout = loginctl lock-session            # lock screen when timeout has passed.
}

listener {
    timeout = 330                                 # 5.5min.
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed.
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected after timeout has fired.
}
