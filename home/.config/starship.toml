# Generated by theme-switch. Edit ~/.local/bin/theme-switch to change this prompt.
palette = "theme"
add_newline = false
command_timeout = 200

format = "$directory$git_branch$git_status$character"

[palettes.theme]
bg = "#1b1420"
bg2 = "#241827"
surface = "#302133"
surface2 = "#49304b"
fg = "#fff0dc"
muted = "#c8aeb0"
accent = "#a9d4df"
blue = "#a9d4df"
yellow = "#ffe0a8"
red = "#d985a3"
term_green = "#d3bc86"
term_cyan = "#a9d4df"
term_magenta = "#b65f90"

[directory]
style = "fg:fg"
repo_root_style = "fg:fg"
read_only = " ro"
truncation_length = 2
truncation_symbol = "…/"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "italic fg:accent"
format = "[$branch]($style) "

[git_status]
style = "fg:muted"
format = "[$all_status$ahead_behind]($style)"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = "= "
up_to_date = ""
untracked = "? "
modified = "! "
stashed = ""
staged = ""
renamed = ""
deleted = ""

[status]
disabled = false
style = "fg:red"
format = "[✗]($style) "

[character]
success_symbol = "[❯](fg:accent)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:muted)"
